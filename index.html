<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bablu Search</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: #111;
    text-align: center;
    transition: 0.3s;
}

header {
    background: #4285f4;
    color: white;
    padding: 35px 15px 30px;
}

h1 {
    margin: 5px 0 25px;
    font-size: 38px;
}

.search-box {
    display: flex;
    max-width: 650px;
    margin: auto;
    background: white;
    border-radius: 35px;
    padding: 5px;
}

#search {
    flex: 1;
    border: none;
    outline: none;
    padding: 15px;
    font-size: 18px;
    border-radius: 30px;
    min-width: 0;
}

button {
    border: none;
    border-radius: 30px;
    background: #4285f4;
    color: white;
    padding: 13px 22px;
    font-size: 16px;
    cursor: pointer;
}

.voice {
    font-size: 20px;
    padding: 12px 18px;
}

.menu {
    padding: 25px 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.menu button {
    min-width: 120px;
}

#content {
    max-width: 700px;
    margin: 20px auto;
    padding: 15px;
}

.history-item {
    background: #f1f1f1;
    margin: 8px 0;
    padding: 12px;
    border-radius: 10px;
    text-align: left;
}

/* Dark Mode */

body.dark {
    background: #121212;
    color: white;
}

body.dark .history-item {
    background: #252525;
}

body.dark #search {
    background: #222;
    color: white;
}

body.dark .search-box {
    background: #222;
}
</style>
</head>

<body>

<header>

<h1>🔎 Bablu Search</h1>

<div class="search-box">

<input
id="search"
type="text"
placeholder="কিছু লিখে Search করুন"
onkeydown="if(event.key==='Enter') searchWeb()"
>

<button onclick="searchWeb()">Search</button>

<button class="voice" onclick="voiceSearch()">🎤</button>

</div>

</header>


<div class="menu">

<button onclick="showHome()">🏠 Home</button>

<button onclick="focusSearch()">🔎 Search</button>

<button onclick="showHistory()">🕘 History</button>

<button onclick="clearHistory()">🗑️ Clear</button>

<button onclick="toggleDark()">🌙 Dark Mode</button>

</div>


<div id="content">

<h2>স্বাগতম 👋</h2>

<p>Bablu Search-এ কিছু লিখে Search করুন।</p>

</div>


<script>

/* SEARCH */

function searchWeb() {

    let text = document.getElementById("search").value.trim();

    if (text === "") {
        alert("কিছু লিখে Search করুন।");
        return;
    }

    saveHistory(text);

    window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);
}


/* HISTORY SAVE */

function saveHistory(text) {

    let history =
        JSON.parse(localStorage.getItem("searchHistory")) || [];

    history.unshift(text);

    history = [...new Set(history)];

    localStorage.setItem(
        "searchHistory",
        JSON.stringify(history)
    );
}


/* SHOW HISTORY */

function showHistory() {

    let history =
        JSON.parse(localStorage.getItem("searchHistory")) || [];

    let content =
        document.getElementById("content");

    if (history.length === 0) {

        content.innerHTML =
            "<h2>🕘 History</h2><p>কোনো Search History নেই।</p>";

        return;
    }

    let html = "<h2>🕘 Search History</h2>";

    history.forEach(function(item) {

        html +=
            '<div class="history-item">🔎 ' +
            escapeHTML(item) +
            '</div>';

    });

    content.innerHTML = html;
}


/* CLEAR HISTORY */

function clearHistory() {

    localStorage.removeItem("searchHistory");

    document.getElementById("content").innerHTML =
        "<h2>🗑️ History Clear হয়েছে</h2>";
}


/* HOME */

function showHome() {

    document.getElementById("content").innerHTML =
        "<h2>স্বাগতম 👋</h2>" +
        "<p>Bablu Search-এ কিছু লিখে Search করুন।</p>";

}


/* SEARCH BUTTON */

function focusSearch() {

    document.getElementById("search").focus();

}


/* DARK MODE */

function toggleDark() {

    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {

        localStorage.setItem("darkMode", "on");

    } else {

        localStorage.setItem("darkMode", "off");

    }
}


/* LOAD DARK MODE */

if (localStorage.getItem("darkMode") === "on") {

    document.body.classList.add("dark");

}


/* VOICE SEARCH */

function voiceSearch() {

    const input =
        document.getElementById("search");

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "এই Preview-তে Voice Search কাজ করছে না। Chrome-এ আপনার সাইটটি খুলে চেষ্টা করুন।"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "bn-BD";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function() {

        input.placeholder =
            "🎤 বলুন...";

    };


    recognition.onresult = function(event) {

        input.value =
            event.results[0][0].transcript;

    };


    recognition.onerror = function(event) {

        alert(
            "Microphone চালু হয়নি। Chrome-এ Microphone Permission Allow করুন।"
        );

    };


    recognition.onend = function() {

        input.placeholder =
            "কিছু লিখে Search করুন";

    };


    recognition.start();

}


/* SECURITY */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
