<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bablu Search</title>
<link rel="manifest" href="manifest.json">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
    transition: 0.3s;
}

/* HEADER */

header {
    background: #4285f4;
    color: white;
    padding: 35px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 22px;
    font-size: 32px;
}

/* SEARCH */

.search-box {
    max-width: 650px;
    margin: auto;
    display: flex;
    background: white;
    padding: 5px;
    border-radius: 30px;
}

.search-box input {
    flex: 1;
    border: none;
    outline: none;
    padding: 14px 18px;
    font-size: 17px;
    border-radius: 30px;
    color: #222;
}

.search-box button {
    border: none;
    background: #1557b0;
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 16px;
}

/* MENU */

.menu {
    text-align: center;
    padding: 15px 8px;
}

.menu button {
    border: none;
    padding: 11px 15px;
    margin: 4px;
    border-radius: 22px;
    background: #4285f4;
    color: white;
    font-size: 14px;
}

/* CONTENT */

#content {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 18px;
    margin: 12px 0;
    border-radius: 14px;
    box-shadow: 0 2px 8px #ddd;
}

.card h2 {
    margin-top: 0;
    color: #174ea6;
}

.history-item {
    padding: 14px;
    margin: 8px 0;
    background: #f1f3f4;
    border-radius: 10px;
}

/* DARK MODE */

.dark {
    background: #121212;
    color: white;
}

.dark .card {
    background: #1f1f1f;
    box-shadow: 0 2px 8px #000;
}

.dark .history-item {
    background: #303134;
}

.dark .search-box {
    background: #303134;
}

.dark .search-box input {
    background: #303134;
    color: white;
}

/* MOBILE */

@media (max-width: 500px) {

    header {
        padding: 28px 10px;
    }

    header h1 {
        font-size: 27px;
    }

    .search-box input {
        font-size: 15px;
    }

    .search-box button {
        padding: 10px 15px;
    }

}
</style>
</head>

<body>

<header>

<h1>🔎 Bablu Search</h1>

<div class="search-box">

<input
id="search"
type="text"
placeholder="কিছু লিখে Search করুন"
>

<button onclick="searchWeb()">
Search
</button>

</div>

</header>


<!-- MENU -->

<div class="menu">

<button onclick="home()">
🏠 Home
</button>

<button onclick="searchWeb()">
🔍 Search
</button>

<button onclick="showHistory()">
🕘 History
</button>

<button onclick="clearHistory()">
🗑️ Clear
</button>

<button onclick="toggleDark()">
🌙 Dark Mode
</button>

</div>


<!-- CONTENT -->

<div id="content">

<div class="card">

<h2>স্বাগতম 👋</h2>

<p>
এটি আপনার Bablu Search App।
</p>

<p>
উপরের Search Box-এ কিছু লিখে Search করুন।
</p>

</div>

</div>


<script>

/* HISTORY */

let historyData =
JSON.parse(
localStorage.getItem("babluHistory")
) || [];


/* HOME */

function home() {

document.getElementById("search").value = "";

document.getElementById("content").innerHTML = `

<div class="card">

<h2>🏠 Bablu Search</h2>

<p>
আপনার Search App-এ স্বাগতম 👋
</p>

<p>
কিছু লিখে Search করুন।
</p>

</div>

`;

}


/* SEARCH */

function searchWeb() {

let query =
document.getElementById("search")
.value
.trim();


if (query === "") {

alert("কিছু লিখুন");

return;

}


/* SAVE HISTORY */

historyData =
historyData.filter(
item => item !== query
);

historyData.unshift(query);

historyData =
historyData.slice(0, 20);

localStorage.setItem(
"babluHistory",
JSON.stringify(historyData)
);


/* GOOGLE SEARCH */

window.location.href =
"https://www.google.com/search?q=" +
encodeURIComponent(query);

}


/* HISTORY */

function showHistory() {

let content =
document.getElementById("content");

content.innerHTML = `

<div class="card">

<h2>🕘 Search History</h2>

<div id="historyList"></div>

</div>

`;


let list =
document.getElementById("historyList");


if (historyData.length === 0) {

list.innerHTML =
"<p>কোনো History নেই।</p>";

return;

}


historyData.forEach(function(item) {

let div =
document.createElement("div");

div.className =
"history-item";

div.innerText =
"🔎 " + item;

list.appendChild(div);

});

}


/* CLEAR */

function clearHistory() {

historyData = [];

localStorage.removeItem(
"babluHistory"
);

document.getElementById("content").innerHTML = `

<div class="card">

<h2>🗑️ History Clear</h2>

<p>
Search History সফলভাবে মুছে ফেলা হয়েছে ✅
</p>

</div>

`;

}


/* DARK MODE */

function toggleDark() {

document.body.classList.toggle("dark");

}

</script>


<!-- SERVICE WORKER -->

<script>

if ("serviceWorker" in navigator) {

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>

</body>
</html>
